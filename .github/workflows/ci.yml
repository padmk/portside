name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Linux runs the full checks. macOS builds the menu bar app and runs the Go
  # tests on pushes to main, pull requests, on demand (the input below) and
  # for every release tag in release.yml.
  workflow_dispatch:
    inputs:
      macos:
        description: Also build on macOS
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make build
      - run: go run ./scripts/notices -check
      - run: go vet ./...
      - run: go test -race ./...
      # Known vulnerabilities in the Go toolchain (go.mod's toolchain line) or modules.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: pnpm --dir web check:contrast
      - run: ./bin/portside version

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: scripts/build-macos-app.sh
      - run: go test ./...
