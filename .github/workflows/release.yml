name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    # Linux and macOS command-line archives with the embedded dashboard.
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # syft on PATH for GoReleaser's SBOMs.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - name: Release notes from CHANGELOG.md
        # The section of this version, without its heading; a tag without one stops here.
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v}" '$0 == h {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}" >&2; exit 1; }
          printf '\n## Install\n\nmacOS 26 or later on Apple Silicon:\n\n```sh\nbrew install --cask %s/tap/portside\n```\n\n`Portside-%s.zip` below is the same app. The `portside_*.tar.gz` archives hold the command-line binary alone (Linux is a preview). See the README for details.\n' "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REF_NAME#v}" >> "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.sbom.json
            dist/checksums.txt

  app:
    # macOS menu bar app, attached to the same release and published as a Homebrew cask, next to a formula that builds the CLI from the tag's source.
    needs: cli
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build Portside.app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-macos-app.sh --zip
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/macos/Portside-*.zip
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/macos/Portside-${GITHUB_REF_NAME#v}.zip" --clobber
      - name: Update the Homebrew cask and formula
        # Skipped until the tap repository and its token are set up.
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          # git asks gh for credentials, so the token stays out of URLs and git config.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 "dist/macos/Portside-$version.zip" | cut -d' ' -f1)
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' dist/macos/Portside.app/Contents/Info.plist)
          # The app's bundle ID is the service label plus ".app" (internal/app).
          label="${bundle%.app}"
          # The formula builds from the tag's source archive.
          curl -fsSL -o "$RUNNER_TEMP/source.tar.gz" "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          source_sha=$(shasum -a 256 "$RUNNER_TEMP/source.tar.gz" | cut -d' ' -f1)
          gh auth setup-git
          git clone "https://github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Casks tap/Formula
          sed -e "s/__VERSION__/$version/" -e "s/__SHA256__/$sha/" -e "s#__REPO__#$GITHUB_REPOSITORY#" \
            -e "s/__BUNDLE_ID__/$bundle/" -e "s/__SERVICE_LABEL__/$label/" \
            packaging/homebrew/portside.rb.tmpl > tap/Casks/portside.rb
          sed -e "s/__VERSION__/$version/" -e "s/__SOURCE_SHA256__/$source_sha/" -e "s#__REPO__#$GITHUB_REPOSITORY#" \
            packaging/homebrew/portside-formula.rb.tmpl > tap/Formula/portside.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/portside.rb Formula/portside.rb
          git commit -m "portside $version"
          git push
