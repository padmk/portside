name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    # Linux and macOS command-line archives with the embedded dashboard.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Release notes from CHANGELOG.md
        # The section of this version, without its heading; a tag without one stops here.
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v}" '$0 == h {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}" >&2; exit 1; }
          printf '\n## Install\n\nmacOS 26 or later on Apple Silicon:\n\n```sh\nbrew install --cask %s/tap/portside\n```\n\nThe archives below hold the command-line binary alone (Linux is a preview). See the README for details.\n' "$GITHUB_REPOSITORY_OWNER" >> "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.18.3
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    # macOS menu bar app, attached to the same release and published as a Homebrew cask.
    needs: cli
    runs-on: macos-26
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build Portside.app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-macos-app.sh --zip
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/macos/Portside-${GITHUB_REF_NAME#v}.zip" --clobber
      - name: Update the Homebrew cask
        # Skipped until the tap repository and its token are set up.
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          # git asks gh for credentials, so the token stays out of URLs and git config.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 "dist/macos/Portside-$version.zip" | cut -d' ' -f1)
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' dist/macos/Portside.app/Contents/Info.plist)
          # The app's bundle ID is the service label plus ".app" (internal/app).
          label="${bundle%.app}"
          gh auth setup-git
          git clone "https://github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/$version/" -e "s/__SHA256__/$sha/" -e "s#__REPO__#$GITHUB_REPOSITORY#" \
            -e "s/__BUNDLE_ID__/$bundle/" -e "s/__SERVICE_LABEL__/$label/" \
            packaging/homebrew/portside.rb.tmpl > tap/Casks/portside.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/portside.rb
          git commit -m "portside $version"
          git push
