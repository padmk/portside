name: release
on:
  push:
    tags: ["v*"]
  # A dry run: builds and checks everything a tag would, publishes nothing.
  workflow_dispatch:

# Building runs the project's code and its dependencies, so the build jobs can
# read the repository and attest what they made, but not change releases or
# reach the tap. Only `publish` and `tap` write, and neither runs project code.
permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  cli:
    # Linux and macOS command-line archives with the embedded dashboard.
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # syft on PATH for GoReleaser's SBOMs.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - name: Release notes from CHANGELOG.md
        # The section of this version, without its heading; a tag without one stops here.
        if: env.PUBLISH == 'true'
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v}" '$0 == h {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}" >&2; exit 1; }
          printf '\n## Install\n\nmacOS 26 or later on Apple Silicon:\n\n```sh\nbrew install --cask %s/tap/portside\n```\n\n`Portside-%s.zip` below is the same app. The `portside_*.tar.gz` archives hold the command-line binary alone (Linux is a preview). See the README for details.\n' "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REF_NAME#v}" >> "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          # The archives only; `publish` creates the release.
          args: release --clean --skip=publish ${{ env.PUBLISH != 'true' && '--snapshot' || '' }}
        env:
          # Read-only here (the job's permissions); GoReleaser reads repository metadata with it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test the macOS archive
        # The binary as users get it: it reports its version and runs a daemon.
        run: |
          t="$RUNNER_TEMP/smoke"; mkdir -p "$t"
          tar -xzf dist/portside_*_darwin_arm64.tar.gz -C "$t" portside
          "$t/portside" version
          if [ "$PUBLISH" = true ]; then "$t/portside" version | grep -q " ${GITHUB_REF_NAME#v} "; fi
          printf 'port = 7911\nroot = "%s"\n' "$t" > "$t/portside.toml"
          export PORTSIDE_CONFIG="$t/portside.toml" PORTSIDE_STATE_DIR="$t/state"
          "$t/portside" daemon start
          "$t/portside" status
          "$t/portside" doctor || true
          "$t/portside" daemon stop
      - name: Collect the release files
        run: |
          mkdir out
          cp dist/*.tar.gz dist/*.sbom.json dist/checksums.txt out/
          if [ -f "$RUNNER_TEMP/notes.md" ]; then cp "$RUNNER_TEMP/notes.md" out/notes.md; fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-path: |
            out/*.tar.gz
            out/*.sbom.json
            out/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: out/
          if-no-files-found: error

  app:
    # The macOS menu bar app.
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build Portside.app
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$PUBLISH" = true ] || version=0.0.0-dryrun
          VERSION="$version" scripts/build-macos-app.sh --zip
          mkdir out
          cp "dist/macos/Portside-$version.zip" out/
          # The tap job renders the cask from it, on a runner without PlistBuddy.
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' dist/macos/Portside.app/Contents/Info.plist > out/bundle-id
          # The app's own copy of the command runs and reports this version.
          dist/macos/Portside.app/Contents/Helpers/portside version | grep -q " $version "
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-path: out/Portside-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: out/
          if-no-files-found: error

  publish:
    # Creates the GitHub release from the built files; runs none of them.
    if: github.event_name == 'push'
    needs: [cli, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require a tested commit on main
        # The tag must point at a commit of main whose `ci` run passed; a run
        # still in progress is waited for.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in identical|behind) ;; *) echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main ($status)" >&2; exit 1;; esac
          for _ in $(seq 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") echo "ci passed for $GITHUB_SHA"; exit 0;;
              completed*) echo "ci did not pass for $GITHUB_SHA: $run" >&2; exit 1;;
              ""|"null null") echo "no ci run for $GITHUB_SHA" >&2; exit 1;;
            esac
            sleep 30
          done
          echo "ci for $GITHUB_SHA did not finish in 30 minutes" >&2; exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release/cli/notes.md \
            release/cli/*.tar.gz release/cli/*.sbom.json release/cli/checksums.txt release/app/Portside-*.zip

  tap:
    # Publishes the cask and the source-build formula to <owner>/homebrew-tap.
    # The token lives in the `release` environment, which only tags `v*` reach.
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/homebrew
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: app
      - name: Update the Homebrew cask and formula
        # Skipped until the tap repository and its token are set up.
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          # git asks gh for credentials, so the token stays out of URLs and git config.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(sha256sum "app/Portside-$version.zip" | cut -d' ' -f1)
          bundle=$(cat app/bundle-id)
          # The app's bundle ID is the service label plus ".app" (internal/app).
          label="${bundle%.app}"
          # The formula builds from the tag's source archive.
          curl -fsSL -o "$RUNNER_TEMP/source.tar.gz" "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          source_sha=$(sha256sum "$RUNNER_TEMP/source.tar.gz" | cut -d' ' -f1)
          gh auth setup-git
          git clone "https://github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Casks tap/Formula
          sed -e "s/__VERSION__/$version/" -e "s/__SHA256__/$sha/" -e "s#__REPO__#$GITHUB_REPOSITORY#" \
            -e "s/__BUNDLE_ID__/$bundle/" -e "s/__SERVICE_LABEL__/$label/" \
            packaging/homebrew/portside.rb.tmpl > tap/Casks/portside.rb
          sed -e "s/__VERSION__/$version/" -e "s/__SOURCE_SHA256__/$source_sha/" -e "s#__REPO__#$GITHUB_REPOSITORY#" \
            packaging/homebrew/portside-formula.rb.tmpl > tap/Formula/portside.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/portside.rb Formula/portside.rb
          git commit -m "portside $version"
          git push
