version: 2
project_name: portside

before:
  hooks:
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build
    # A stale THIRD_PARTY_NOTICES.txt blocks the release.
    - go run ./scripts/notices -check

builds:
  - main: ./cmd/portside
    binary: portside
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ignore:
      # macOS builds target Apple Silicon only.
      - goos: darwin
        goarch: amd64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, THIRD_PARTY_NOTICES.txt]

checksum:
  name_template: checksums.txt

# The release workflow publishes the archives to the public release repository.
release:
  disable: true

changelog:
  disable: true
