# golangci-lint configuration. `make lint` runs the version pinned in
# tools/go.mod in three passes (see docs/development.md, "Linters"):
#   1. every linter below except noctx and contextcheck, over all code;
#   2. noctx and contextcheck over code changed since LINT_BASE only, since
#      the code before them calls exec.Command and friends without a context;
#   3. funlen and gocognit, which only warn.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - forbidigo
    - nilerr
    - noctx
  settings:
    errcheck:
      exclude-functions:
        # Writes to a terminal, an HTTP response or an in-memory log: the
        # caller has nothing to do with a failed write.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Its Write keeps the bytes in memory and always returns nil.
        - (*github.com/padmk/portside/internal/supervisor.LogBuffer).Write
        # Closing a file, connection or descriptor that is done with: the
        # descriptor is released either way. A file whose writes must reach
        # the disk is closed with a checked Close (see paths.WriteFile).
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*github.com/coder/websocket.Conn).Close
        - (*github.com/coder/websocket.Conn).CloseNow
        - syscall.Close
    govet:
      enable:
        - shadow
    exhaustive:
      # A switch with a default case handles every other value on purpose.
      default-signifies-exhaustive: true
      # A mouse handler acts on the few buttons it uses (the wheel, a
      # click); the terminal's button set has a dozen more. The type is
      # named by whichever alias the field's package declares.
      ignore-types:
        - ^(charm\.land/bubbletea/v2|github\.com/charmbracelet/(ultraviolet|x/ansi))\.MouseButton$
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^http\.(DefaultClient|Get|Head|Post|PostForm)$
          msg: the default HTTP client has no timeout; use an http.Client with one
    staticcheck:
      checks:
        - all
        # The defaults golangci-lint leaves out: package comments, naming
        # and receiver style.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Suggestions to rewrite a condition by De Morgan's law: the form
        # written usually follows the prose of the rule it checks.
        - -QF1001
    funlen:
      lines: 120
      statements: 80
    gocognit:
      min-complexity: 40
  exclusions:
    rules:
      # `if err := f(); err != nil` inside a function with its own err is
      # idiomatic; shadowing any other name is still reported.
      - linters: [govet]
        text: 'shadow: declaration of "err" shadows'
      # Tests bound every call by go test's own timeout.
      - path: _test\.go
        linters: [noctx, contextcheck]
      # Test responses come from httptest recorders and from test servers
      # and WebSocket handshakes that end with the test.
      - path: _test\.go
        linters: [bodyclose]
      # A test reads from top to bottom; its length is no warning sign.
      - path: _test\.go
        linters: [funlen, gocognit]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
